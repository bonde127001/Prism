macos:
    name: Build macOS DMG (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
            sb_arch: arm64
          - arch: x64
            target: x86_64-apple-darwin
            sb_arch: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.target_repo || 'chinaxsir/prism-Alpha' }}
          ref: ${{ github.event.inputs.target_ref || 'main' }}
          token: ${{ secrets.REMOTE_PAT || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-${{ matrix.arch }}

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Fetch macOS kernel and geo databases
        shell: bash
        run: |
          set -e
          mkdir -p src-tauri/binaries src-tauri/resources
          node scripts/fetch-kernel.cjs --target ${{ matrix.target }} || node scripts/fetch-kernel.cjs

          TARGET_BIN="src-tauri/binaries/sing-box-${{ matrix.target }}"
          SB_VER="1.11.3"
          if [ ! -f "$TARGET_BIN" ] || ! file "$TARGET_BIN" | grep -qi "${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}"; then
            echo "Downloading sing-box v${SB_VER} for darwin-${{ matrix.sb_arch }} -> $TARGET_BIN"
            TMP_DIR=$(mktemp -d)
            TARBALL="sing-box-${SB_VER}-darwin-${{ matrix.sb_arch }}.tar.gz"
            curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/${TARBALL}" -o "$TMP_DIR/$TARBALL"
            tar -xzf "$TMP_DIR/$TARBALL" -C "$TMP_DIR"
            cp -f "$TMP_DIR/sing-box-${SB_VER}-darwin-${{ matrix.sb_arch }}/sing-box" "$TARGET_BIN"
            rm -rf "$TMP_DIR"
          fi

          chmod +x "$TARGET_BIN"
          cp -f "$TARGET_BIN" "src-tauri/binaries/sing-box"
          file "$TARGET_BIN"

      - name: Ensure valid macOS entitlements.plist
        shell: bash
        run: |
          set -e
          cat > src-tauri/entitlements.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
            <key>com.apple.security.network.client</key>
            <true/>
            <key>com.apple.security.network.server</key>
            <true/>
          </dict>
          </plist>
          EOF
          plutil -lint src-tauri/entitlements.plist
          cp -f src-tauri/entitlements.plist entitlements.plist

      - name: Build macOS App and DMG
        env:
          CI: "true"
        shell: bash
        run: |
          set -e
          APP_VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          npx tauri build --target ${{ matrix.target }} --bundles app --verbose

          APP_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          APP_BUNDLE=$(find "$APP_DIR" -maxdepth 1 -name "*.app" -type d | head -1)
          test -n "$APP_BUNDLE"

          xattr -crs "$APP_BUNDLE" || true
          find "$APP_BUNDLE" -type f -name "sing-box*" -exec chmod +x {} + 2>/dev/null || true
          codesign --force --deep --sign - --entitlements src-tauri/entitlements.plist "$APP_BUNDLE"

          STAGE_DIR=$(mktemp -d)
          cp -R "$APP_BUNDLE" "$STAGE_DIR/"
          ln -s /Applications "$STAGE_DIR/Applications"

          OUT_DMG="$PWD/Prism-${APP_VERSION}-macos-${{ matrix.arch }}.dmg"
          rm -f "$OUT_DMG"
          hdiutil create \
            -volname "Prism" \
            -srcfolder "$STAGE_DIR" \
            -ov -format UDZO \
            "$OUT_DMG"
          rm -rf "$STAGE_DIR"
          ls -lh "$OUT_DMG"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Prism-macos-${{ matrix.arch }}-dmg
          path: Prism-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
